<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Circle – friends chat & stories</title>
<style>
:root{--bg:#fff;--fg:#1a1a1f;--mut:#7b7b88;--card:#f2f2f6;--line:#e4e4ea;--acc:#7c4dff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111116;--fg:#f1f1f5;--mut:#9a9aa6;--card:#1d1d25;--line:#2a2a34}}
:root[data-theme="dark"]{--bg:#111116;--fg:#f1f1f5;--mut:#9a9aa6;--card:#1d1d25;--line:#2a2a34}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column}
header{padding:12px 16px;font-weight:700;font-size:20px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
main{flex:1;overflow-y:auto;padding:12px 16px}
nav{display:flex;border-top:1px solid var(--line)}
nav button{flex:1;padding:12px;background:none;border:0;color:var(--mut);font:inherit;font-weight:600}
nav button.on{color:var(--acc)}
button,input,textarea{font:inherit;color:inherit}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:8px 14px;font-weight:600}
.btn.g{background:var(--card);color:var(--fg)}
input,textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;box-sizing:border-box}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.row .n{flex:1;min-width:0}.row small{color:var(--mut);display:block}
.av{width:44px;height:44px;border-radius:50%;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.ring{padding:3px;background:linear-gradient(45deg,#f9a825,#e91e63,#7c4dff);border-radius:50%}
.ring .av{border:3px solid var(--bg)}
.stories{display:flex;gap:14px;overflow-x:auto;padding:4px 0 14px}
.stories>div{text-align:center;font-size:12px;flex:none;width:64px}
.stories .av{width:56px;height:56px;margin:0 auto 4px}
h3{margin:16px 0 6px;font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
#msgs{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:6px}
.m{max-width:75%;padding:8px 12px;border-radius:16px;background:var(--card);align-self:flex-start;word-wrap:break-word}
.m.me{background:var(--acc);color:#fff;align-self:flex-end}
.bar{display:flex;gap:8px;padding:10px 16px;border-top:1px solid var(--line)}
.qr{background:#fff;padding:12px;border-radius:12px;display:inline-block}
.ov{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;text-align:center;font-size:26px;font-weight:700;color:#fff;overflow:auto}
.ov small{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));left:16px;font-size:14px;opacity:.85}
.sw{display:flex;gap:8px;margin:10px 0}.sw i{width:28px;height:28px;border-radius:50%;border:2px solid transparent}.sw i.on{border-color:var(--fg)}
video{width:100%;border-radius:12px;margin-top:8px}
.msg{color:var(--mut);text-align:center;margin-top:40px}
</style></head>
<body><div id="app"><div class="msg">Loading…</div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script>
const $=document.getElementById.bind(document),app=$('app');
const h=(t,a={},...c)=>{const e=document.createElement(t);for(const k in a){if(k.startsWith('on'))e[k]=a[k];else e.setAttribute(k,a[k])}c.flat().forEach(x=>x!=null&&e.append(x));return e};
const BG=['#7c4dff','#e91e63','#ff7043','#00897b','#1e88e5'];
let db,auth,authUser,me,names={},friends=[],stories=[],tab='chats',chat=null,unsubM=null,msgs=[],bgI=0,stream=null,toastT;
const DAY=864e5,pid=(a,b)=>[a,b].sort().join('_'),other=f=>f.members.find(x=>x!==me);
let profs={},registered=false;const nm=id=>(profs[id]&&profs[id].name)||names[id]||'Friend';
const av=id=>h('div',{class:'av'},(nm(id)[0]||'?').toUpperCase());
function toast(t){clearTimeout(toastT);let e=$('toast');if(!e){e=h('div',{id:'toast',style:'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:20px;z-index:30'});document.body.append(e)}e.textContent=t;e.style.display='block';toastT=setTimeout(()=>e.style.display='none',2600)}

function init(){
  if(!window.firebase||!window.FIREBASE_CONFIG||String(FIREBASE_CONFIG.apiKey).startsWith('YOUR')){app.replaceChildren(h('div',{class:'msg'},'Add your Firebase keys to firebase-config.js (see README).'));return}
  firebase.initializeApp(FIREBASE_CONFIG);auth=firebase.auth();db=firebase.firestore();
  auth.onAuthStateChanged(u=>{if(u){if(!authUser){authUser=u;start()}}else{authUser=null;loginScreen()}});
}
function loginScreen(){
  const err=h('div',{style:'color:#e53935;min-height:22px;font-size:13px;margin:10px 0'});
  const prov=()=>new firebase.auth.GoogleAuthProvider();
  app.replaceChildren(h('header',{},'Circle'),h('main',{},h('p',{style:'color:var(--mut)'},'Chat and share 24-hour stories with friends.'),
    h('button',{class:'btn',onclick:async()=>{try{await auth.signInWithPopup(prov())}catch(e){if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment')auth.signInWithRedirect(prov());else err.textContent='Sign-in failed: '+(e.code||e.message)}}},'Continue with Google'),err))
}
async function start(){
  me=authUser.uid;names[me]=authUser.displayName||'';
  await new Promise(r=>{db.collection('profiles').onSnapshot(s=>{profs={};s.docs.forEach(d=>profs[d.id]=d.data());if(registered&&!chat)render();r()},()=>r())});
  if(!profs[me])await register();
  registered=true;
  db.collection('friends').where('members','array-contains',me).onSnapshot(s=>{friends=s.docs.map(d=>({id:d.id,...d.data()}));if(!chat)render()},()=>{});
  db.collection('stories').orderBy('t','desc').limit(100).onSnapshot(s=>{stories=s.docs.map(d=>({id:d.id,...d.data()}));if(!chat)render()},()=>{});
  render();
}
function register(){return new Promise(res=>{
  const em=authUser.email||'';
  const n=h('input',{placeholder:'Your name',maxlength:'30',value:names[me]||''});
  const u=h('input',{placeholder:'username (a–z, 0–9, _)',maxlength:'20'});
  const err=h('div',{style:'color:#e53935;min-height:22px;font-size:13px;margin:6px 0'});
  const go=h('button',{class:'btn',onclick:async()=>{
    const name=n.value.trim(),handle=u.value.trim().toLowerCase().replace(/^@/,'');
    if(!name)return err.textContent='Enter your name';
    if(!/^[a-z0-9_]{3,20}$/.test(handle))return err.textContent='Username: 3–20 letters, numbers or _';
    go.disabled=true;
    try{const q=await db.collection('profiles').where('handle','==',handle).get();
      if(q.docs.some(d=>d.id!==me)){err.textContent='That username is taken';go.disabled=false;return}
      await db.doc('profiles/'+me).set({name,handle,t:Date.now()});profs[me]={name,handle};res()
    }catch(e){err.textContent='Could not register, try again';go.disabled=false}}},'Create account');
  app.replaceChildren(h('header',{},'Join Circle'),h('main',{},h('p',{style:'color:var(--mut)'},'Create your profile so friends can find you.'),h('h3',{},'Email (from your Google account)'),h('input',{readonly:'',value:em||'Google account'}),h('h3',{},'Name'),n,h('h3',{},'Username'),u,err,go))})}
const okF=()=>friends.filter(f=>f.status==='ok');
const live=()=>stories.filter(s=>Date.now()-s.t<DAY&&(s.uid===me||okF().some(f=>other(f)===s.uid)));

function render(){
  const head=h('header',{},'Circle ',h('small',{style:'font-weight:400;color:var(--mut);font-size:13px;flex:1'},nm(me)),h('button',{class:'btn g',style:'padding:4px 10px;font-size:12px',onclick:()=>auth.signOut().then(()=>location.reload())},'Sign out'));
  const nav=h('nav',{},...[['chats','Chats'],['stories','Stories'],['add','Add friend']].map(([k,l])=>h('button',{class:tab===k?'on':'',onclick:()=>{stopScan();tab=k;render()}},l)));
  const main=h('main',{});
  if(tab==='chats')chatsTab(main);else if(tab==='stories')storiesTab(main);else addTab(main);
  app.replaceChildren(head,main,nav);
}
function chatsTab(m){
  const inc=friends.filter(f=>f.status==='pending'&&f.from!==me);
  if(inc.length){m.append(h('h3',{},'Requests'));inc.forEach(f=>m.append(h('div',{class:'row'},av(other(f)),h('div',{class:'n'},nm(other(f))),h('button',{class:'btn',onclick:()=>db.doc('friends/'+f.id).update({status:'ok'})},'Accept'),h('button',{class:'btn g',onclick:()=>db.doc('friends/'+f.id).delete()},'Decline'))))}
  m.append(h('h3',{},'Friends'));
  const ok=okF();
  if(!ok.length)m.append(h('div',{class:'msg'},'No friends yet. Use “Add friend” to share your QR or search.'));
  ok.forEach(f=>m.append(h('div',{class:'row',onclick:()=>openChat(f)},av(other(f)),h('div',{class:'n'},nm(other(f)),h('small',{},'Tap to chat')))));
  friends.filter(f=>f.status==='pending'&&f.from===me).forEach(f=>m.append(h('div',{class:'row'},av(other(f)),h('div',{class:'n'},nm(other(f)),h('small',{},'Request sent')))));
}
function openChat(f){
  chat=f;msgs=[];const o=other(f);
  const list=h('div',{id:'msgs'});
  const inp=h('input',{placeholder:'Message…',maxlength:'500'});
  const send=()=>{const t=inp.value.trim();if(!t)return;inp.value='';db.collection('msgs').add({pair:f.id,from:me,text:t,t:Date.now()}).catch(()=>toast('Could not send'))};
  inp.onkeydown=e=>{if(e.key==='Enter')send()};
  app.replaceChildren(h('header',{},h('button',{class:'btn g',onclick:closeChat},'←'),av(o),nm(o)),list,h('div',{class:'bar'},inp,h('button',{class:'btn',onclick:send},'Send')));
  unsubM=db.collection('msgs').where('pair','==',f.id).onSnapshot(s=>{
    msgs=s.docs.map(d=>d.data()).sort((a,b)=>a.t-b.t);
    list.replaceChildren(...msgs.map(x=>h('div',{class:'m'+(x.from===me?' me':'')},x.text)));list.scrollTop=list.scrollHeight},()=>{});
}
function closeChat(){if(unsubM)unsubM();unsubM=null;chat=null;render()}

function storiesTab(m){
  const by={};live().sort((a,b)=>a.t-b.t).forEach(s=>(by[s.uid]=by[s.uid]||[]).push(s));
  const row=h('div',{class:'stories'},h('div',{onclick:compose},h('div',{class:'av',style:'background:var(--card);color:var(--fg);font-size:26px'},'+'),'Your story'));
  Object.keys(by).forEach(u=>row.append(h('div',{onclick:()=>view(by[u])},h('div',{class:'ring'},av(u)),u===me?'You':nm(u))));
  m.append(row);
  if(!Object.keys(by).length)m.append(h('div',{class:'msg'},'No stories right now. Post one — it disappears after 24 hours.'));
}
function compose(){
  const ta=h('textarea',{rows:'4',placeholder:'What’s on your mind?',maxlength:'200'});
  const sw=h('div',{class:'sw'});
  const paint=()=>[...sw.children].forEach((e,i)=>e.className=i===bgI?'on':'');
  BG.forEach((c,i)=>sw.append(h('i',{style:'background:'+c,onclick:()=>{bgI=i;paint()}})));paint();
  const m=app.querySelector('main');
  m.replaceChildren(h('h3',{},'New story'),ta,sw,h('button',{class:'btn',onclick:async()=>{const t=ta.value.trim();if(!t)return;await db.collection('stories').add({uid:me,text:t,bg:BG[bgI],t:Date.now()}).catch(()=>toast('Could not post'));render()}},'Share to friends'),' ',h('button',{class:'btn g',onclick:render},'Cancel'));
}
function view(list){
  let i=0;const o=h('div',{class:'ov'});document.body.append(o);
  const show=()=>{if(i>=list.length){o.remove();return}const s=list[i];o.style.background=s.bg;o.replaceChildren(h('small',{},(s.uid===me?'You':nm(s.uid))+' · '+(i+1)+'/'+list.length+' · tap to continue'),h('div',{},s.text));};
  o.onclick=()=>{i++;show()};show();
}

function addTab(m){
  const qr=h('div',{class:'qr'});
  m.append(h('h3',{},'Your QR code'),qr,h('p',{style:'color:var(--mut);margin:8px 0'},'Friends scan this to send you a request.'),
    h('div',{style:'display:flex;gap:8px'},h('input',{readonly:'',value:me}),h('button',{class:'btn g',onclick:()=>{navigator.clipboard&&navigator.clipboard.writeText(me).then(()=>toast('Code copied'),()=>toast('Copy not allowed'))}},'Copy')));
  try{new QRCode(qr,{text:me,width:170,height:170})}catch(e){qr.textContent='QR unavailable'}
  const code=h('input',{placeholder:'Paste a friend’s code'});
  const res=h('div',{});
  const q=h('input',{placeholder:'Search by name or @username'});
  let tm;q.oninput=()=>{clearTimeout(tm);tm=setTimeout(async()=>{res.replaceChildren();if(!q.value.trim())return;try{const s=q.value.trim().toLowerCase().replace(/^@/,'');const r=Object.keys(profs).filter(i=>i!==me&&((profs[i].name||'').toLowerCase().includes(s)||(profs[i].handle||'').includes(s))).map(i=>({id:i}));r.forEach(p=>{res.append(h('div',{class:'row'},av(p.id),h('div',{class:'n'},nm(p.id),h('small',{},'@'+(profs[p.id].handle||''))),h('button',{class:'btn',onclick:()=>addFriend(p.id)},'Add')))});if(!r.length)res.append(h('div',{class:'msg',style:'margin:12px'},'No one found.'))}catch(e){toast('Search unavailable')}},300)};
  m.append(h('h3',{},'Search'),q,res,h('h3',{},'Scan or enter code'),h('button',{class:'btn',onclick:scan},'Scan friend’s QR'),h('video',{id:'v',playsinline:'',muted:'',style:'display:none'}),h('div',{style:'display:flex;gap:8px;margin-top:10px'},code,h('button',{class:'btn g',onclick:()=>addFriend(code.value.trim(),true)},'Add')));
}
async function addFriend(id,instant){
  if(!id||id===me)return toast('That’s your own code');
  const ex=friends.find(f=>other(f)===id);if(ex&&ex.status==='ok'){return instant?openChat(ex):toast('Already friends')}if(ex&&!instant)return toast('Request already pending');
  try{await db.doc('friends/'+pid(me,id)).set({members:[me,id].sort(),from:me,status:instant?'ok':'pending',t:Date.now()});if(instant){openChat({id:pid(me,id),members:[me,id].sort(),status:'ok'})}else toast('Request sent')}catch(e){toast('Could not add')}
}
function stopScan(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
async function scan(){
  const v=$('v');
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});v.srcObject=stream;v.style.display='block';await v.play();
    const c=document.createElement('canvas'),x=c.getContext('2d');
    const tick=()=>{if(!stream)return;if(v.videoWidth){c.width=v.videoWidth;c.height=v.videoHeight;x.drawImage(v,0,0);const d=x.getImageData(0,0,c.width,c.height),r=jsQR(d.data,c.width,c.height);if(r&&r.data){stopScan();v.style.display='none';addFriend(r.data,true);return}}requestAnimationFrame(tick)};tick();
  }catch(e){stopScan();toast('Camera isn’t available here — paste the code instead')}
}
init();
</script></body></html>
